name: Feature request
description: Propose a focused product or operator improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, Vault content, OTPs, QR data, credentials, cookies, tokens, or private vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem and users
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, and localization impact
      description: Explain affected boundaries, provider data, and Indonesian/English copy.
