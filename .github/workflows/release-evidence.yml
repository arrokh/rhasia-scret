name: Repository release evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify from a clean checkout
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-evidence:
    name: Repository release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: release_evidence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d release_evidence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/release_evidence?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/release_evidence?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://auth-release-evidence.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: release-evidence-publishable-key
      PLAYWRIGHT_WORKERS: 2
      BROWSER_TEST_SEQUENTIAL: 1
      PLAYWRIGHT_SMOKE_WORKERS: 1
      PLAYWRIGHT_E2E_WORKERS: 1
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository release evidence
        run: pnpm run verify:release-evidence
      - name: Verify release version alignment
        run: pnpm run verify:version-alignment
      - name: Run complete repository gate
        run: pnpm run test:full
      - name: Record reproducible metadata
        run: |
          mkdir -p artifacts/release-evidence
          git rev-parse HEAD > artifacts/release-evidence/commit.txt
          node --version > artifacts/release-evidence/toolchain.txt
          pnpm --version >> artifacts/release-evidence/toolchain.txt
          sha256sum pnpm-lock.yaml > artifacts/release-evidence/lockfile.sha256
      - name: Upload repository evidence metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-release-evidence
          path: artifacts/release-evidence/
          if-no-files-found: error
          retention-days: 14
