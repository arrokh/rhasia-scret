name: Repository release evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify from a clean checkout
        required: false
        default: main
      readiness_record:
        description: Candidate readiness record path inside docs/release-readiness/
        required: true

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-evidence:
    name: Repository release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhasia_test
          POSTGRES_PASSWORD: rhasia_test_password
          POSTGRES_DB: rhasia_scret_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhasia_test -d rhasia_scret_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      REQUIRE_DATABASE_INTEGRATION: "1"
      PLAYWRIGHT_WORKERS: 2
      BROWSER_TEST_SEQUENTIAL: 1
      PLAYWRIGHT_SMOKE_WORKERS: 1
      PLAYWRIGHT_E2E_WORKERS: 1
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.4
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mark job-owned synthetic database scope
        shell: bash
        run: |
          set -euo pipefail
          printf 'RHSIA_DISPOSABLE_RUN_ID=%016x\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'RHSIA_DISPOSABLE_DATA_CLASSIFICATION=synthetic\n' >> "$GITHUB_ENV"
          printf 'RHSIA_GO_INTEGRATION_DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Generate Prisma parity client and validate the reference schema
        run: |
          pnpm --filter @rhasia-scret/api-parity run test:parity:generate
          pnpm --filter @rhasia-scret/api-parity run test:parity:validate
      - name: Build the Sqitch migration image
        run: docker build --file apps/api/Dockerfile.migration --target migration --tag "rhasia-scret-api-migrate-evidence:${GITHUB_RUN_ID}" .
      - name: Deploy and verify the Sqitch baseline
        env:
          DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@host.docker.internal:5432/rhasia_scret_test?schema=public
        run: >-
          docker run --rm --name "rhasia-scret-evidence-sqitch-${GITHUB_RUN_ID}"
          --add-host=host.docker.internal:host-gateway --env DIRECT_URL
          "rhasia-scret-api-migrate-evidence:${GITHUB_RUN_ID}"
      - name: Remove the run-owned Sqitch migration image
        if: always()
        run: |
          image="rhasia-scret-api-migrate-evidence:${GITHUB_RUN_ID}"
          if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
      - name: Verify repository release evidence
        env:
          RELEASE_READINESS_RECORD: ${{ inputs.readiness_record }}
        run: pnpm run verify:release-evidence
      - name: Verify release version alignment
        run: pnpm run verify:version-alignment
      - name: Run complete repository gate
        run: pnpm run test:full
      - name: Record reproducible metadata
        run: |
          mkdir -p artifacts/release-evidence
          git rev-parse HEAD > artifacts/release-evidence/commit.txt
          node --version > artifacts/release-evidence/toolchain.txt
          pnpm --version >> artifacts/release-evidence/toolchain.txt
          sha256sum pnpm-lock.yaml > artifacts/release-evidence/lockfile.sha256
      - name: Upload repository evidence metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-release-evidence
          path: artifacts/release-evidence/
          if-no-files-found: error
          retention-days: 14
