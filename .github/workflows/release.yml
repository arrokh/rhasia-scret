name: Repository release publication

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_pr:
        description: Merged dedicated release PR number to re-verify and publish
        required: true
        type: number

permissions:
  contents: read

jobs:
  candidate:
    name: Identify dedicated release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      readiness_record: ${{ steps.candidate.outputs.readiness_record }}
      pull_request: ${{ steps.candidate.outputs.pull_request }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Confirm this is a dedicated release PR merge
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          RECOVERY_PR: ${{ inputs.recovery_pr }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$WORKFLOW_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || { echo "::error::Publication recovery must run from main."; exit 1; }
            [[ "$RECOVERY_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::A valid merged release PR number is required."; exit 1; }
            PR_NUMBER="$RECOVERY_PR"
            PR_JSON="$(gh api "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}")"
            [[ "$(jq -r '.base.ref' <<< "$PR_JSON")" == "main" ]] || { echo "::error::Recovery PR must target main."; exit 1; }
            [[ "$(jq -r '.merged_at' <<< "$PR_JSON")" != "null" ]] || { echo "::error::Recovery PR must already be merged."; exit 1; }
            SOURCE_SHA="$(jq -r '.merge_commit_sha' <<< "$PR_JSON")"
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Recovery PR has no valid merge commit SHA."; exit 1; }
            git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA" || { echo "::error::Recovery source is not on the selected main history."; exit 1; }
            PR_BASE_SHA="$(git rev-parse "${SOURCE_SHA}^1")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            PR_BASE_SHA="$PUSH_BASE_SHA"
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Push event has no valid pre-merge main SHA."; exit 1; }
          else
            echo "::error::Unsupported release workflow event."; exit 1
          fi
          git cat-file -e "${SOURCE_SHA}^{commit}"
          VERSION="$(git show "${SOURCE_SHA}:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Root product version is not stable SemVer."; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release source must be a full commit SHA."; exit 1; }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release base must be a full commit SHA."; exit 1; }
          TAG="v${VERSION}"
          EXPECTED_TITLE="[infra][chore] Prepare release ${TAG}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            JQ_FILTER=".[] | select(.base.ref == \"main\" and .merged_at != null and .title == \"${EXPECTED_TITLE}\") | .number"
            PR_NUMBERS="$(gh api "repos/${GH_REPOSITORY}/commits/${SOURCE_SHA}/pulls" --jq "$JQ_FILTER")"
            if [[ -z "$PR_NUMBERS" ]]; then
              printf '%s\n' 'publish=false' >> "$GITHUB_OUTPUT"
              echo "No merged dedicated release PR for ${TAG}; publication is skipped."
              exit 0
            fi
            if [[ "$(printf '%s\n' "$PR_NUMBERS" | wc -l | tr -d ' ')" != "1" ]]; then
              echo "::error::More than one merged release PR claims ${TAG}."
              exit 1
            fi
            PR_NUMBER="$PR_NUMBERS"
          fi
          PR_TITLE="$(gh api "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title')"
          [[ "$PR_TITLE" == "$EXPECTED_TITLE" ]] || { echo "::error::Recovery PR title must be exactly ${EXPECTED_TITLE}."; exit 1; }
          FILES="$(gh api --paginate "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          RECORD="docs/release-readiness/${TAG}.md"
          grep -Fxq "CHANGELOG.md" <<< "$FILES" || { echo "::error::Release PR must update CHANGELOG.md."; exit 1; }
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              CHANGELOG.md|"$RECORD"|package.json|apps/*/package.json|packages/*/package.json) ;;
              *) echo "::error::Release PR contains out-of-scope file ${path}."; exit 1 ;;
            esac
          done <<< "$FILES"
          node tools/verify-release-pr-changes.mjs --version "$VERSION" --sha "$SOURCE_SHA" --base "$PR_BASE_SHA"
          {
            printf 'publish=true\n'
            printf 'version=%s\n' "$VERSION"
            printf 'tag=%s\n' "$TAG"
            printf 'readiness_record=%s\n' "$RECORD"
            printf 'pull_request=%s\n' "$PR_NUMBER"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Release candidate %s\n' "$TAG"
            printf '%s\n' "- Merged release PR: #${PR_NUMBER}"
            printf -- '- Source commit: `%s`\n' "$SOURCE_SHA"
            printf -- '- Validation base: `%s`\n' "$PR_BASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify exact release source
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify candidate readiness
        env:
          RELEASE_READINESS_RECORD: ${{ needs.candidate.outputs.readiness_record }}
        run: pnpm run verify:release-evidence:ready
      - name: Verify version alignment and publication notes
        env:
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          pnpm run verify:version-alignment
          node tools/release-publication.mjs --sha "$SOURCE_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Install Chromium system dependencies
        run: pnpm --filter @rhasia-scret/web exec playwright install-deps chromium
      - name: Install Playwright Chromium browser
        run: pnpm --filter @rhasia-scret/web exec playwright install chromium
      - name: Run the complete isolated repository gate
        run: pnpm run test:full:container
      - name: Record exact-source verification evidence
        id: source
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.source_sha }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]
          mkdir -p "$RUNNER_TEMP/repository-release-evidence"
          printf '%s\n' "$ACTUAL_SHA" > "$RUNNER_TEMP/repository-release-evidence/source-commit.txt"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/repository-release-evidence/version.txt"
          node --version > "$RUNNER_TEMP/repository-release-evidence/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/repository-release-evidence/toolchain.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/repository-release-evidence/lockfile.sha256"
          sha256sum "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/repository-release-evidence/release-notes.sha256"
          printf '%s\n' \
            'candidate-readiness=passed' \
            'version-alignment=passed' \
            'workflow-policy=passed' \
            'format=passed' \
            'release-process-tests=passed' \
            'test-full-container=passed' > "$RUNNER_TEMP/repository-release-evidence/checks.txt"
          echo "sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"
      - name: Upload exact-source verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-release-${{ needs.candidate.outputs.version }}-${{ needs.candidate.outputs.source_sha }}
          path: ${{ runner.temp }}/repository-release-evidence/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish annotated tag and GitHub Release
    needs: [candidate, verify]
    if: needs.candidate.outputs.publish == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repository-release-publish-${{ needs.candidate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Revalidate exact tested source and prepare notes
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          node tools/release-publication.mjs --sha "$SOURCE_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create or verify the immutable annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            EXISTING_SHA="$(git rev-parse "${TAG}^{commit}")"
            OBJECT_TYPE="$(git cat-file -t "refs/tags/${TAG}")"
            [[ "$EXISTING_SHA" == "$SOURCE_SHA" ]] || { echo "::error::${TAG} points at ${EXISTING_SHA}, not tested commit ${SOURCE_SHA}."; exit 1; }
            [[ "$OBJECT_TYPE" == "tag" ]] || { echo "::error::${TAG} is lightweight; refusing replacement."; exit 1; }
            echo "Verified existing annotated tag ${TAG} at ${SOURCE_SHA}."
          else
            git tag -a "$TAG" "$SOURCE_SHA" -m "Repository release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/existing-release-body.md" 2>/dev/null; then
            grep -Fq "Source commit: ${SOURCE_SHA}" "$RUNNER_TEMP/existing-release-body.md" || {
              echo "::error::Existing GitHub Release ${TAG} does not identify the tested source commit."; exit 1;
            }
            echo "Verified existing GitHub Release ${TAG} for ${SOURCE_SHA}."
          else
            gh release create "$TAG" \
              --title "v${VERSION} Latest" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Record and upload publication provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repository-release-publication"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/repository-release-publication/source-commit.txt"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/repository-release-publication/version.txt"
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/repository-release-publication/tag.txt"
          git rev-parse "${TAG}^{commit}" > "$RUNNER_TEMP/repository-release-publication/tag-target.txt"
          git cat-file -t "refs/tags/${TAG}" > "$RUNNER_TEMP/repository-release-publication/tag-object-type.txt"
          gh release view "$TAG" --json url --jq .url > "$RUNNER_TEMP/repository-release-publication/github-release-url.txt"
          node --version > "$RUNNER_TEMP/repository-release-publication/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/repository-release-publication/toolchain.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/repository-release-publication/lockfile.sha256"
          sha256sum "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/repository-release-publication/release-notes.sha256"
          printf '%s\n' \
            'candidate-readiness=passed' \
            'version-alignment=passed' \
            'workflow-policy=passed' \
            'format=passed' \
            'release-process-tests=passed' \
            'test-full-container=passed' \
            'annotated-tag=verified' \
            'github-release=created-or-verified' > "$RUNNER_TEMP/repository-release-publication/checks.txt"
      - name: Upload publication provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-release-publication-${{ needs.candidate.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/repository-release-publication/
          if-no-files-found: error
          retention-days: 90

  images:
    name: Publish Docker Hub image (${{ matrix.image }})
    needs: [candidate, verify, publish]
    if: needs.candidate.outputs.publish == 'true' && needs.verify.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: repository-release-image-${{ needs.candidate.outputs.tag }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rhasia-scret
            dockerfile: apps/web/Dockerfile
            target: runtime
          - image: rhasia-scret-api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image: rhasia-scret-api-migrate
            dockerfile: apps/api/Dockerfile.migration
            target: migration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets before publishing release images."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and push versioned image
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="docker.io/arrokh/${IMAGE_NAME}"
          docker build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --target "$TARGET" \
            --build-arg "COMMIT_SHA=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            .
          docker push "${IMAGE}:${RELEASE_TAG}" | tee "$RUNNER_TEMP/docker-push-release.log"
          RELEASE_DIGEST="$(awk '{ for (i = 1; i <= NF; i++) if ($i == "digest:" && $(i + 1) ~ /^sha256:/) { print $(i + 1); exit } }' "$RUNNER_TEMP/docker-push-release.log")"
          [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Docker Hub did not report a valid release image digest."; exit 1; }
          PROVENANCE_DIR="$RUNNER_TEMP/dockerhub-publication"
          mkdir -p "$PROVENANCE_DIR"
          {
            printf 'image=%s\n' "$IMAGE"
            printf 'release-tag=%s\n' "$RELEASE_TAG"
            printf 'source-commit=%s\n' "$SOURCE_SHA"
            printf 'version=%s\n' "$VERSION"
            printf 'dockerfile=%s\n' "$DOCKERFILE"
            printf 'target=%s\n' "$TARGET"
            printf 'platform=linux/amd64\n'
            printf 'digest=%s\n' "$RELEASE_DIGEST"
          } > "$PROVENANCE_DIR/image.txt"
      - name: Upload image provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockerhub-image-${{ matrix.image }}-${{ needs.candidate.outputs.version }}-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/dockerhub-publication/
          if-no-files-found: error
          retention-days: 90

  image-overview:
    name: Summarize Docker Hub images
    needs: [candidate, verify, publish, images]
    if: needs.candidate.outputs.publish == 'true' && needs.verify.result == 'success' && needs.publish.result == 'success' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dockerhub-image-*-${{ needs.candidate.outputs.version }}-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/dockerhub-image-provenance
      - name: Add Docker Hub image overview
        env:
          DOCKERHUB_PROVENANCE_DIR: ${{ runner.temp }}/dockerhub-image-provenance
          VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: node tools/write-dockerhub-image-summary.mjs
