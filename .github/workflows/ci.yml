name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and database test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shared_totp_vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d shared_totp_vault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shared_totp_vault_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shared_totp_vault_test?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shared client package
        run: pnpm run test:full:core
      - name: Verify mobile package
        run: pnpm run test:full:mobile

      - name: Save pnpm cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Review production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - name: Review dependency licenses
        run: pnpm run verify:dependency-licenses
      - name: Generate Prisma Client
        run: pnpm run prisma:generate
      - name: Validate Prisma schema
        run: pnpm run prisma:validate
      - name: Apply migrations
        run: pnpm run prisma:migrate:deploy
      - name: Backfill provider-neutral identities
        run: pnpm run prisma:backfill-external-identities
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run unit, integration, and contract tests
        run: pnpm run test
      - name: Check architecture boundaries
        run: pnpm run test:architecture
      - name: Build
        run: pnpm run build
      - name: Verify client build output
        run: pnpm run verify:build-output
      - name: Verify route bundle budgets
        run: pnpm --filter @rhasia-scret/web run performance:bundles:verify

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: browser_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d browser_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/browser_smoke?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/browser_smoke?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://auth-browser-test.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: browser-smoke-publishable-key
      PLAYWRIGHT_WORKERS: 2
      # Avoid cross-suite CPU and database contention on constrained hosted runners.
      BROWSER_TEST_SEQUENTIAL: 1
      PLAYWRIGHT_SMOKE_WORKERS: 1
      PLAYWRIGHT_E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - name: Review dependency licenses
        run: pnpm run verify:dependency-licenses
      - name: Generate Prisma Client
        run: pnpm run prisma:generate
      - name: Apply migrations
        run: pnpm run prisma:migrate:deploy
      - name: Backfill provider-neutral identities
        run: pnpm run prisma:backfill-external-identities
      - name: Install Playwright system dependencies
        run: pnpm --filter @rhasia-scret/web exec playwright install-deps chromium firefox webkit
      - name: Ensure supported browsers are installed
        run: pnpm --filter @rhasia-scret/web exec playwright install chromium firefox webkit

      - name: Save Playwright browser cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run browser smoke tests
        run: pnpm run test:browser
      - name: Run navigation performance checks
        run: pnpm run test:performance
