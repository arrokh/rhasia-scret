name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ci-changes-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    outputs:
      core: ${{ steps.detect.outputs.core }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Detect affected packages across the complete push
        id: detect
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/detect-ci-changes.mjs

  repository:
    name: Repository policy and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ci-repository-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify CI policy
        run: pnpm run verify:ci-policy
      - name: Test CI change detection
        run: pnpm run test:ci-changes
      - name: Test release evidence tooling
        run: pnpm run test:release-evidence
      - name: Test release automation
        run: pnpm run test:release-process
      - name: Verify release version alignment
        run: pnpm run verify:version-alignment

      - name: Save pnpm cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Review production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - name: Review dependency licenses
        run: pnpm run verify:dependency-licenses

  core:
    name: Shared client package verification
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ci-core-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shared client package
        run: pnpm run test:full:core

  quality:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Quality and database test suite
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ci-web-quality-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhasia_test
          POSTGRES_PASSWORD: rhasia_test_password
          POSTGRES_DB: rhasia_scret_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhasia_test -d rhasia_scret_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      REQUIRE_DATABASE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.4
          cache-dependency-path: apps/api/go.sum
      - name: Mark job-owned synthetic database scope
        shell: bash
        run: |
          set -euo pipefail
          printf 'RHSIA_DISPOSABLE_RUN_ID=%016x\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'RHSIA_DISPOSABLE_DATA_CLASSIFICATION=synthetic\n' >> "$GITHUB_ENV"
          printf 'RHSIA_GO_INTEGRATION_DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Build the Sqitch migration image
        run: docker build --file apps/api/Dockerfile.migration --target migration --tag "rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}" .
      - name: Deploy and verify the Sqitch baseline
        env:
          DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@host.docker.internal:5432/rhasia_scret_test?schema=public
        run: >-
          docker run --rm --name "rhasia-scret-ci-sqitch-${GITHUB_RUN_ID}"
          --add-host=host.docker.internal:host-gateway --env DIRECT_URL
          "rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}"
      - name: Remove the run-owned Sqitch migration image
        if: always()
        run: |
          image="rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}"
          if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
      - name: Verify generated API contracts
        run: pnpm run verify:api-contract
      - name: Verify Go API unit, integration, race, and build gates
        run: pnpm run verify:api-go
      - name: Run API test-tool lint, typecheck, and unit tests
        run: pnpm --filter @rhasia-scret/api-test-tools run test:full
      - name: Lint
        run: pnpm --filter @rhasia-scret/web run lint
      - name: Typecheck
        run: pnpm run typecheck:web
      - name: Run unit, integration, and contract tests
        run: pnpm run test:web
      - name: Check architecture boundaries
        run: pnpm run test:architecture
      - name: Build
        run: pnpm run build
      - name: Verify route bundle budgets
        run: pnpm --filter @rhasia-scret/web run performance:bundles:verify

  browser-smoke:
    needs:
      - changes
      - browser-smoke-shards
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false')
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          # - firefox: intentionally deferred from hosted CI coverage
          # - webkit: intentionally deferred from hosted CI coverage
    steps:
      - name: Verify all browser smoke shards passed
        shell: bash
        env:
          CHANGE_DETECTION_RESULT: "${{ needs.changes.result }}"
          BROWSER_SMOKE_SHARDS_RESULT: "${{ needs.browser-smoke-shards.result }}"
        run: |
          if [[ "$CHANGE_DETECTION_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed; browser coverage is unknown."
            exit 1
          fi
          if [[ "$BROWSER_SMOKE_SHARDS_RESULT" != "success" ]]; then
            echo "::error::Browser smoke shard matrix did not succeed."
            exit 1
          fi

  browser-smoke-shards:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Browser smoke (${{ matrix.browser }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ci-web-browser-smoke-${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.browser }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          # - firefox: intentionally deferred from hosted CI coverage
          # - webkit: intentionally deferred from hosted CI coverage
        shard: [1, 2, 3]
    env:
      # Smoke tests mock database-backed API operations. Keep accidental DB access fail-closed.
      DATABASE_URL: postgresql://browser-smoke:unused@127.0.0.1:1/browser_smoke?schema=public
      # Each isolated runner executes one worker from a distinct suite shard.
      PLAYWRIGHT_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
          # Reuse the previous all-browser cache on the first matrix rollout.
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.4
          cache-dependency-path: apps/api/go.sum
      - name: Install Playwright system dependencies
        run: pnpm --filter @rhasia-scret/web exec playwright install-deps "${{ matrix.browser }}"
      - name: Ensure supported browsers are installed
        run: pnpm --filter @rhasia-scret/web exec playwright install "${{ matrix.browser }}"

      - name: Save Playwright browser cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run browser smoke suite shard
        run: pnpm run test:browser:smoke --project="${{ matrix.browser }}" --shard="${{ matrix.shard }}/3" --reporter=list

  browser-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ci-web-browser-e2e-${{ github.workflow }}-${{ github.ref_name }}-${{ matrix.browser }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          # - firefox: intentionally deferred from hosted CI coverage
          # - webkit: intentionally deferred from hosted CI coverage
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhasia_test
          POSTGRES_PASSWORD: rhasia_test_password
          POSTGRES_DB: rhasia_scret_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhasia_test -d rhasia_scret_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      # E2E test fixtures require a database; run encrypted workflows with two workers.
      PLAYWRIGHT_WORKERS: 1
      PLAYWRIGHT_E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
          # Reuse the previous all-browser cache on the first matrix rollout.
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.4
          cache-dependency-path: apps/api/go.sum
      - name: Mark job-owned synthetic database scope
        shell: bash
        run: |
          set -euo pipefail
          printf 'RHSIA_DISPOSABLE_RUN_ID=%016x\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'RHSIA_DISPOSABLE_DATA_CLASSIFICATION=synthetic\n' >> "$GITHUB_ENV"
          printf 'RHSIA_GO_INTEGRATION_DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Build the Sqitch migration image
        run: docker build --file apps/api/Dockerfile.migration --target migration --tag "rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}-e2e" .
      - name: Deploy and verify the Sqitch baseline
        env:
          DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@host.docker.internal:5432/rhasia_scret_test?schema=public
        run: >-
          docker run --rm --name "rhasia-scret-ci-sqitch-${GITHUB_RUN_ID}-e2e"
          --add-host=host.docker.internal:host-gateway --env DIRECT_URL
          "rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}-e2e"
      - name: Remove the run-owned Sqitch migration image
        if: always()
        run: |
          image="rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}-e2e"
          if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
      - name: Install Playwright system dependencies
        run: pnpm --filter @rhasia-scret/web exec playwright install-deps "${{ matrix.browser }}"
      - name: Ensure supported browsers are installed
        run: pnpm --filter @rhasia-scret/web exec playwright install "${{ matrix.browser }}"

      - name: Save Playwright browser cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run browser E2E suite
        run: pnpm run test:browser:e2e --project="${{ matrix.browser }}" --reporter=list

  browser-production:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Production PWA and navigation performance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ci-web-production-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhasia_test
          POSTGRES_PASSWORD: rhasia_test_password
          POSTGRES_DB: rhasia_scret_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhasia_test -d rhasia_scret_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@127.0.0.1:5432/rhasia_scret_test?schema=public
      PLAYWRIGHT_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-all-${{ hashFiles('pnpm-lock.yaml') }}
          # Reuse the previous all-browser cache on the first matrix rollout.
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.4
          cache-dependency-path: apps/api/go.sum
      - name: Mark job-owned synthetic database scope
        shell: bash
        run: |
          set -euo pipefail
          printf 'RHSIA_DISPOSABLE_RUN_ID=%016x\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'RHSIA_DISPOSABLE_DATA_CLASSIFICATION=synthetic\n' >> "$GITHUB_ENV"
          printf 'RHSIA_GO_INTEGRATION_DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Build the Sqitch migration image
        run: docker build --file apps/api/Dockerfile.migration --target migration --tag "rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}-production" .
      - name: Deploy and verify the Sqitch baseline
        env:
          DIRECT_URL: postgresql://rhasia_test:rhasia_test_password@host.docker.internal:5432/rhasia_scret_test?schema=public
        run: >-
          docker run --rm --name "rhasia-scret-ci-sqitch-${GITHUB_RUN_ID}-production"
          --add-host=host.docker.internal:host-gateway --env DIRECT_URL
          "rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}-production"
      - name: Remove the run-owned Sqitch migration image
        if: always()
        run: |
          image="rhasia-scret-api-migrate-ci:${GITHUB_RUN_ID}-production"
          if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image"; fi
      - name: Install Playwright system dependencies
        run: pnpm --filter @rhasia-scret/web exec playwright install-deps chromium
      - name: Ensure supported browsers are installed
        run: pnpm --filter @rhasia-scret/web exec playwright install chromium

      - name: Save Playwright browser cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run production PWA tests
        run: pnpm run test:browser:pwa --project=chromium --reporter=list
      - name: Run navigation performance checks
        run: pnpm run test:performance
