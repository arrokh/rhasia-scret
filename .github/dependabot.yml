version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      workspace-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: daily
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: daily
