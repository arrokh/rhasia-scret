packages:
  - "apps/*"
  - "packages/*"
  - "tools/api-migration-runtime"

overrides:
  hono: 4.13.13
  find-my-way: 9.7.0
  postcss: 8.5.23
  # Fix GHSA-68fv-2mgg-jv7q in transitive CSS and Prisma config dependencies.
  source-map-js: 1.2.2
  # Fix CVE-2026-96889 in the transitive Next.js Sharp dependency.
  sharp: 0.35.5
  "@istanbuljs/load-nyc-config>js-yaml": 3.15.2
  "cosmiconfig>js-yaml": 4.3.2
  "@eslint/eslintrc>js-yaml": 4.3.2
  deepmerge-ts: 8.0.2
  valibot: 1.4.2
  qs: 6.16.0
  mysql2: 3.23.1
  # Keep Vitest's transitive obug dependency on a release older than the
  # minimum-release-age window while retaining the compatible ^2.1.1 range.
  obug: 2.1.4
  # Fix GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g, and GHSA-hrr3-gc8f-f4qj,
  # plus GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr,
  # and GHSA-333x-w4r6-6crp in Ajv's transitive fast-uri dependency.
  "ajv>fast-uri": 3.1.9
  # Fix GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv, and GHSA-rxp7-6hxx-x8q5 in address-validation dependencies.
  ip-address: 10.7.4
  # Keep every transitive esbuild consumer on the release that fixes the
  # Windows development-server path traversal advisory (GHSA-g7r4-m6w7-qqqr).
  esbuild: 0.28.2

allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  "@prisma/engines": true
  "@swc/core": false
  core-js: true
  esbuild: true
  protobufjs: false
  prisma: true
  sharp: true
  ssh2: false
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - "@prisma/engines"
  - core-js
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.9
  - ip-address@10.3.1
  - hono@4.12.34
  - js-yaml@4.3.2
  - nanoid@3.3.17
  - obug@2.2.1
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
