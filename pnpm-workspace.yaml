packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@hono/node-server": 2.0.12
  hono: 4.13.7
  find-my-way: 9.7.0
  postcss: 8.5.23
  sharp: 0.35.4
  "@istanbuljs/load-nyc-config>js-yaml": 3.15.2
  "cosmiconfig>js-yaml": 4.3.2
  "@eslint/eslintrc>js-yaml": 4.3.2
  "xcode>uuid": 11.1.1
  deepmerge-ts: 8.0.2
  valibot: 1.4.2
  qs: 6.16.0
  mysql2: 3.23.1
  # Keep Vitest's transitive obug dependency on a release older than the
  # minimum-release-age window while retaining the compatible ^2.1.1 range.
  obug: 2.1.4
  "@expo/plist>@xmldom/xmldom": 0.8.15
  "plist>@xmldom/xmldom": 0.9.12
  fast-uri: 3.1.6

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@swc/core": false
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/engines"
  - core-js
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.14 || 57.0.21 || 57.0.23"
  - "@expo/fingerprint@0.20.7 || 0.20.12"
  - "@expo/inline-modules@0.1.5"
  - "@expo/local-build-cache-provider@57.0.6"
  - "@expo/metro-config@57.0.8"
  - "@expo/prebuild-config@57.0.11"
  - expo-asset@57.0.10 || 57.0.16
  - expo-constants@57.0.10 || 57.0.17
  - expo-server@57.0.2
  - expo@57.0.12 || 57.0.19 || 57.0.21
  - jest-expo@57.0.4
  - uuid@11.1.1
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.9
  - ip-address@10.3.1
  - hono@4.12.34
  - js-yaml@4.3.2
  - nanoid@3.3.17
  - "@expo/router-server@57.0.9"
  - babel-preset-expo@57.0.10 || 57.0.11
  - expo-font@57.0.3
  - expo-linking@57.0.9
  - expo-modules-core@57.0.15 || 57.0.17
  - expo-modules-jsi@57.0.7 || 57.1.0
  - expo-secure-store@57.0.3
  - expo-sharing@57.0.17
  - "@expo/metro-file-map@57.0.3"
  - obug@2.2.1
auditConfig: { ignoreGhsas: [GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq] }
patchedDependencies:
  expo-modules-jsi@57.1.0: patches/expo-modules-jsi@57.1.0.patch
