packages:
  - "apps/*"
  - "packages/*"

overrides:
  '@hono/node-server': 2.0.12
  find-my-way: 9.7.0
  postcss: 8.5.23
  sharp: 0.35.3
  'xcode>uuid': 11.1.1
  deepmerge-ts: 8.0.2
  valibot: 1.4.2

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/engines"
  - core-js
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/prebuild-config@57.0.11'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12
  - jest-expo@57.0.4
  - uuid@11.1.1
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.9
  - fast-uri@3.1.5
  - ip-address@10.3.1
  - hono@4.12.34
  - js-yaml@4.3.1
  - nanoid@3.3.17
auditConfig: { ignoreGhsas: [ GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq ] }
