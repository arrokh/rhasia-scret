"paths":
  "/auth/magic-link/request":
    "post":
      "operationId": "postAuthMagiclinkRequest"
      "summary": "POST /auth/magic-link/request"
      "tags":
        - "auth"
      "description": "Validates the same-origin request and optional Turnstile
        challenge, applies anonymous email/IP limits, persists a one-time
        challenge and sends an email. The response does not reveal whether the
        email already has an account."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/MagicLinkRequest"
      "responses":
        "200":
          "description": "Challenge request accepted."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MagicLinkSentResponse"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "403":
          "description": "Origin rejected, Turnstile failed, or an invalid proxy marker
            was supplied. Origin and proxy failures may have an empty body."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["turnstile_failed", "forbidden"]
          "x-rhasia-empty-body-outcomes": ["origin_rejected"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "429":
          "description": "Anonymous request limit exceeded."
          "headers":
            "Retry-After":
              "$ref": "#/components/headers/RetryAfter"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["rate_limited"]
        "503":
          "description": "Challenge provider, rate limiter, challenge persistence, or
            email delivery is unavailable."
          "headers":
            "Retry-After":
              "$ref": "#/components/headers/RetryAfter"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes":
            - turnstile_unavailable
            - rate_limit_unavailable
            - email_delivery_failed
            - api_misconfigured
            - authentication_misconfigured
        "500":
          $ref: "#/components/responses/InternalError"
      "security": []
      "x-rhasia-auth": "anonymous"
      "x-rhasia-origin": "required-same-origin"
      "x-rhasia-json-strict": true
      "x-rhasia-body-limit-bytes": 262144
      "x-rhasia-turnstile": "optional-when-unconfigured-required-when-configured"
      "x-rhasia-rate-limit": { "email": 5, "ip": 20, "windowSeconds": 900 }
  "/auth/magic-link/redeem":
    "post":
      "operationId": "postAuthMagiclinkRedeem"
      "summary": "POST /auth/magic-link/redeem"
      "tags":
        - "auth"
      "description": "Consumes a one-time challenge for the selected client. Web
        responses set browser session cookies; PWA responses return only the
        refresh credential and safe continuation path."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/MagicLinkRedeemRequest"
      "responses":
        "200":
          "description": "Challenge redeemed. Web success sets three passwordless session
            cookies and clears the continuation cookie; PWA success sets no
            cookies."
          "headers":
            "Set-Cookie":
              "$ref": "#/components/headers/RepeatedSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MagicLinkRedeemResponse"
        "400":
          "description": "Malformed request, expired link, or redemption failure."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["invalid_request", "link_expired", "redemption_failed"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          "description": "Origin rejected or invalid proxy marker supplied; origin failure
            may have an empty body."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["forbidden"]
          "x-rhasia-empty-body-outcomes": ["origin_rejected"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ApiUnavailable"
      "security": []
      "x-rhasia-auth": "anonymous"
      "x-rhasia-origin": "required-same-origin"
      "x-rhasia-json-strict": true
      "x-rhasia-body-limit-bytes": 262144
      "x-rhasia-cookie-contract": "web-cookies; PWA-returns-refresh-token-in-body"
  "/auth/pwa/session":
    "post":
      "operationId": "postAuthPwaSession"
      "summary": "POST /auth/pwa/session"
      "tags":
        - "auth"
      "description": "Publishes a refresh credential to a one-time PWA handoff or
        redeems a handoff using its verifier. The receiver gets browser session
        cookies only after the publisher's refresh credential is verified."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PwaSessionRequest"
      "responses":
        "200":
          "description": "Publisher accepted or receiver completed the handoff. Receiver
            success sets session cookies and clears the continuation cookie."
          "headers":
            "Set-Cookie":
              "$ref": "#/components/headers/RepeatedSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PwaSessionSuccessResponse"
        "202":
          "description": "The publisher has not completed this one-time handoff yet."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PwaPendingResponse"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          "description": "Malformed handoff request."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["invalid_request"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          "description": "Handoff expired, invalid, or could not be redeemed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["handoff_failed"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          "description": "Origin rejected or invalid proxy marker supplied; origin failure
            may have an empty body."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["forbidden"]
          "x-rhasia-empty-body-outcomes": ["origin_rejected"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ApiUnavailable"
      "security": []
      "x-rhasia-auth": "one-time-handoff-proof"
      "x-rhasia-origin": "required-same-origin"
      "x-rhasia-json-strict": true
      "x-rhasia-body-limit-bytes": 262144
      "x-rhasia-cookie-contract": "receiver-success-only"
  "/auth/session/refresh":
    "post":
      "operationId": "postAuthSessionRefresh"
      "summary": "POST /auth/session/refresh"
      "tags":
        - "auth"
      "description": "Refreshes the browser assertion for an active browser session;
        it does not rotate access or refresh credentials. Authorization headers
        are rejected."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RefreshSessionRequest"
      "responses":
        "200":
          "description": "Active session refreshed. Passwordless sessions renew only the
            browser assertion cookie."
          "headers":
            "Set-Cookie":
              "$ref": "#/components/headers/RepeatedSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/SessionRefreshedResponse"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "401":
          "description": "No active session; all passwordless session cookies are cleared."
          "headers":
            "Set-Cookie":
              "$ref": "#/components/headers/RepeatedSetCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["session_expired"]
        "403":
          "description": "Origin rejected; response body is empty. Invalid proxy marker
            supplied is rejected by middleware."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["forbidden"]
          "x-rhasia-empty-body-outcomes": ["origin_rejected"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ApiUnavailable"
      "security": []
      "x-rhasia-auth": "active-browser-session"
      "x-rhasia-origin": "required-same-origin"
      "x-rhasia-json-strict": true
      "x-rhasia-body-limit-bytes": 262144
      "x-rhasia-authorization-header": "rejected"
  "/auth/session/revoke":
    "post":
      "operationId": "postAuthSessionRevoke"
      "summary": "POST /auth/session/revoke"
      "tags":
        - "auth"
      "description": "Idempotently terminates the current browser session. Termination
        failures are intentionally swallowed and do not reveal session state."
      "responses":
        "204":
          "description": "Session termination completed or was already complete."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
            "Set-Cookie":
              "$ref": "#/components/headers/RepeatedSetCookie"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "403":
          "description": "Cookie credentials lacked the proxy marker, or a supplied origin
            is not same-origin. Invalid proxy marker supplied is rejected by
            middleware."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes": ["forbidden"]
          "x-rhasia-empty-body-outcomes": ["origin_rejected", "cookie_without_proxy_marker"]
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ApiUnavailable"
      "security": []
      "x-rhasia-auth": "session-termination-only"
      "x-rhasia-origin": "same-origin-if-present"
      "x-rhasia-authorization-header": "rejected"
      "x-rhasia-request-body": "ignored"
      "x-rhasia-cookie-proxy-requirement": "required-when-cookie-header-is-nonempty"
  "/health":
    "get":
      "operationId": "getHealth"
      "summary": "GET /health"
      "tags":
        - "health"
      "description": "Database-independent liveness response."
      "responses":
        "200":
          "description": "API process is available."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HealthResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      "x-rhasia-auth": "none"
      "x-rhasia-head": true
      "x-rhasia-request-logging": "skipped"
  "/time":
    "get":
      "operationId": "getTime"
      "summary": "GET /time"
      "tags":
        - "time"
      "description": "Database-independent current-time response using an ISO-8601 UTC
        timestamp with millisecond precision."
      "responses":
        "200":
          "description": "Current UTC time."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TimeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      "x-rhasia-auth": "none"
      "x-rhasia-head": true
      "x-rhasia-request-logging": "skipped"
  "/internal/retention-purge":
    "get":
      "operationId": "getInternalRetentionpurge"
      "summary": "GET /internal/retention-purge"
      "tags":
        - "operations"
      "description": "Runs one bounded retention-purge batch. Requires the configured
        CRON_SECRET as a Bearer credential; reports contain counts and a
        synthetic correlation job ID only, and failures do not expose provider
        or database diagnostics."
      "responses":
        "200":
          "description": "A bounded redacted purge report."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RetentionPurgeResponse"
        "401":
          "description": "The CRON_SECRET Bearer credential is missing or invalid."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes":
            - "unauthorized"
        "500":
          "description": "The bounded purge failed; only the opaque job ID is returned."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                oneOf:
                  - $ref: "#/components/schemas/RetentionPurgeFailureResponse"
                  - $ref: "#/components/schemas/ApiError"
          "x-rhasia-error-codes":
            - retention_purge_failed
            - internal_error
        "503":
          "description": "Retention purge is not configured."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
          "x-rhasia-error-codes":
            - retention_purge_not_configured
            - api_misconfigured
            - authentication_misconfigured
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      "x-rhasia-auth": "CRON_SECRET-bearer"
      "x-rhasia-authorization-header": "Bearer CRON_SECRET required"
      "x-rhasia-operation": "one-bounded-retention-batch"
      "x-rhasia-cache": "no-store"
      x-rhasia-head-behavior: reject-with-405-without-purge
  "/me":
    "get":
      "operationId": "getMe"
      "summary": "GET /me"
      "tags":
        - "account"
      "description": "Returns the authenticated application user's public account identity."
      "responses":
        "200":
          "description": "Application user identity."
          "content":
            "application/json":
              "schema": { "$ref": "#/components/schemas/ApplicationUserResponse" }
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/InactiveUserOrForbidden" }
        "503":
          "description": "Authentication or application-user persistence is unavailable."
          "content":
            "application/json":
              "schema": { "$ref": "#/components/schemas/ApiError" }
          "x-rhasia-error-codes": ["authentication_misconfigured", "api_misconfigured"]
          headers:
            Cache-Control:
