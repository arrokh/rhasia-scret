        - "vaultId"
        - "lifecycle"
        - "role"
        - "effectiveAccountPermissions"
        - "encryptedName"
        - "encryptionVersion"
        - "encryptedVaultKey"
        - "keyVersion"
        - "accounts"
      "properties":
        "vaultId": *a1
        "lifecycle":
          "type": "string"
          "const": "ACTIVE"
        "role":
          "type": "string"
          "enum":
            - "OWNER"
            - "VIEWER"
        "effectiveAccountPermissions":
          "$ref": "#/components/schemas/EffectiveSharedVaultAccountPermissions"
        "encryptedName":
          "$ref": "#/components/schemas/EncryptedProfileBlob"
        "encryptionVersion":
          "type": "integer"
          "const": 1
        "encryptedVaultKey":
          "$ref": "#/components/schemas/EncryptedProfileBlob"
        "keyVersion": *a3
        "accounts":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/OfflineAccountResponse"
      "additionalProperties": false
    "OfflineSyncBundleResponse":
      "type": "object"
      "required":
        - "schemaVersion"
        - "profileId"
        - "synchronizedAt"
        - "synchronizationToken"
        - "cryptoProfile"
        - "personalVault"
        - "sharedVaults"
      "properties":
        "schemaVersion":
          "type": "integer"
          "const": 2
        "profileId": *a1
        "synchronizedAt": *a12
        "synchronizationToken":
          "type": "string"
          "minLength": 1
          "maxLength": 256
        "cryptoProfile":
          "$ref": "#/components/schemas/OfflineCryptoProfile"
        "personalVault":
          "$ref": "#/components/schemas/OfflinePersonalVault"
        "sharedVaults":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/OfflineSharedVault"
      "additionalProperties": false
    "EncryptedPersonalSnapshot":
      "type": "object"
      "required":
        - "schemaVersion"
        - "profileId"
        - "synchronizedAt"
        - "synchronizationToken"
        - "cryptoProfile"
        - "personalVault"
      "properties":
        "schemaVersion":
          "type": "integer"
          "const": 3
        "profileId": *a1
        "synchronizedAt": *a12
        "synchronizationToken":
          "type": "string"
          "minLength": 1
          "maxLength": 256
        "cryptoProfile":
          "$ref": "#/components/schemas/OfflineCryptoProfile"
        "personalVault":
          "$ref": "#/components/schemas/OfflinePersonalVault"
      "additionalProperties": false
    "AuthorizedUserEncryptionIdentity":
      "type": "object"
      "required":
        - "publicKey"
        - "encryptedPrivateKey"
        - "encryptionVersion"
      "properties":
        "publicKey":
          "$ref": "#/components/schemas/UserEncryptionPublicKey"
        "encryptedPrivateKey":
          "$ref": "#/components/schemas/EncryptedProfileBlob"
        "encryptionVersion":
          "type": "integer"
          "const": 1
      "additionalProperties": false
    "AuthorizedWorkspaceResponse":
      "type": "object"
      "required":
        - "responseVersion"
        - "workspaceSynchronizationToken"
        - "synchronizedAt"
        - "personalSnapshot"
        - "sharedVaults"
      "properties":
        "responseVersion":
          "type": "integer"
          "const": 1
        "workspaceSynchronizationToken":
          "type": "string"
          "minLength": 1
          "maxLength": 256
        "synchronizedAt": *a12
        "personalSnapshot":
          "$ref": "#/components/schemas/EncryptedPersonalSnapshot"
        "sharedVaults":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/OfflineSharedVault"
        "userEncryptionIdentity":
          "$ref": "#/components/schemas/AuthorizedUserEncryptionIdentity"
      "additionalProperties": false
  "responses":
    "InvalidRequest":
      "description": "Request body, header, or credential-channel validation failed."
      "headers":
        "Cache-Control":
          "$ref": "#/components/headers/NoStore"
        "X-Request-Id":
          "$ref": "#/components/headers/RequestId"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/ApiError"
      "x-rhasia-error-codes": ["invalid_request"]
    "Unauthenticated":
      "description": "A fresh authenticated application user is required."
      "headers":
        "Cache-Control": { "$ref": "#/components/headers/NoStore" }
        "X-Request-Id": { "$ref": "#/components/headers/RequestId" }
      "content":
        "application/json":
          "schema": { "$ref": "#/components/schemas/ApiError" }
      "x-rhasia-error-codes": ["unauthenticated"]
    "RateLimited":
      "description": "The application mutation limit is exceeded."
      "headers":
        "Cache-Control": { "$ref": "#/components/headers/NoStore" }
        "X-Request-Id": { "$ref": "#/components/headers/RequestId" }
        "Retry-After": { "$ref": "#/components/headers/RetryAfter" }
      "content":
        "application/json":
          "schema": { "$ref": "#/components/schemas/ApiError" }
      "x-rhasia-error-codes": ["rate_limited"]
    "RateLimitUnavailable":
