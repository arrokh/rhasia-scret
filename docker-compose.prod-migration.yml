# External production migration override. The base Compose file points the
# migration service at its Compose-managed `db`; this override uses the
# production pooled/direct URLs and is always run with `--no-deps`.
services:
  migrate:
    depends_on: []
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.prod}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL must be set in .env.prod}
